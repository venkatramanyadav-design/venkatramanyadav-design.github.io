<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blockcraft</title>
<style>
  @font-face {
    font-family: 'Blocky';
    src: local('Courier New');
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #000;
    font-family: 'Courier New', monospace;
    image-rendering: pixelated;
    user-select: none;
  }
  #canvasHolder { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Crosshair */
  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 18px; height: 18px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 1px rgba(0,0,0,0.9);
  }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; width: 18px; height: 2px; }

  /* Hotbar */
  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 10;
    padding: 6px; background: rgba(20,18,14,0.55);
    border: 2px solid #2b2620;
  }
  .slot {
    width: 46px; height: 46px;
    border: 2px solid #4a4235;
    background: #33302a;
    position: relative;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .slot .swatch { position: absolute; inset: 6px; }
  .slot .num {
    position: absolute; top: 1px; left: 3px;
    font-size: 10px; color: #d8d2c4; text-shadow: 1px 1px 0 #000;
  }
  .slot.active { border-color: #f2e9d0; box-shadow: 0 0 0 2px #f2e9d0, inset 0 0 0 2px rgba(0,0,0,0.4); }

  /* HUD top-left */
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #eee6d0; font-size: 12px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000;
    background: rgba(20,18,14,0.4);
    padding: 8px 10px;
    border: 2px solid #2b2620;
  }

  /* Start / pause overlay */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(ellipse at center, #3a4a2a 0%, #1c2414 70%, #0c0f08 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #f2e9d0;
    text-align: center;
    cursor: pointer;
  }
  #overlay h1 {
    font-size: 52px; margin: 0 0 6px 0;
    letter-spacing: 2px;
    color: #8fd15a;
    text-shadow: 3px 3px 0 #2b3d1c, 6px 6px 0 rgba(0,0,0,0.5);
    font-weight: bold;
  }
  #overlay .sub { color: #cfc7ac; margin-bottom: 26px; font-size: 14px; }
  #overlay .startBtn {
    padding: 12px 30px;
    background: #4a7a2e;
    border: 3px solid #2b3d1c;
    color: #f2e9d0;
    font-size: 16px;
    font-family: inherit;
    box-shadow: 0 4px 0 #2b3d1c;
  }
  #overlay .startBtn:hover { background: #58902f; }
  #controls {
    margin-top: 28px; font-size: 12px; color: #b9b298;
    display: grid; grid-template-columns: auto auto; gap: 4px 16px;
    text-align: left;
  }
  #controls b { color: #f2e9d0; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<div id="canvasHolder"></div>
<div id="crosshair"></div>
<div id="hud">
  Blocks placed/broken this session: <span id="stat">0</span><br>
  Pos: <span id="pos">0, 0, 0</span>
</div>
<div id="hotbar"></div>

<div id="overlay">
  <h1>BLOCKCRAFT</h1>
  <div class="sub">a tiny voxel sandbox</div>
  <div class="startBtn">Click to play</div>
  <div id="controls">
    <div><b>WASD</b></div><div>move</div>
    <div><b>Mouse</b></div><div>look around</div>
    <div><b>Space</b></div><div>jump / fly up</div>
    <div><b>Shift</b></div><div>fly down (double-tap Space to fly)</div>
    <div><b>Left Click</b></div><div>break block</div>
    <div><b>Right Click</b></div><div>place block</div>
    <div><b>1-6</b></div><div>select block</div>
    <div><b>Esc</b></div><div>pause / menu</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // ---------- Setup ----------
  const holder = document.getElementById('canvasHolder');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x86b6e8);
  scene.fog = new THREE.Fog(0x86b6e8, 35, 90);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  holder.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff3d6, 0.9);
  sun.position.set(40, 60, 20);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Block types ----------
  const BLOCK_TYPES = [
    { id: 1, name: 'Grass', color: 0x5b9b3b },
    { id: 2, name: 'Dirt',  color: 0x8a5a34 },
    { id: 3, name: 'Stone', color: 0x8d8d8d },
    { id: 4, name: 'Wood',  color: 0x6b4423 },
    { id: 5, name: 'Leaves',color: 0x2f7d32 },
    { id: 6, name: 'Sand',  color: 0xdac878 },
  ];
  const colorOf = {};
  BLOCK_TYPES.forEach(b => colorOf[b.id] = b.color);

  const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
  const materials = {};
  BLOCK_TYPES.forEach(b => {
    materials[b.id] = new THREE.MeshLambertMaterial({ color: b.color });
  });

  // ---------- World data ----------
  const WORLD_SIZE = 26; // half-extent, world spans -SIZE..SIZE
  const voxels = new Map(); // key "x,y,z" -> type id
  const key = (x, y, z) => x + ',' + y + ',' + z;

  function pseudoNoise(x, z) {
    return Math.sin(x * 0.25) * 2 + Math.cos(z * 0.22) * 2 + Math.sin((x + z) * 0.12) * 1.5;
  }

  function generateWorld() {
    for (let x = -WORLD_SIZE; x <= WORLD_SIZE; x++) {
      for (let z = -WORLD_SIZE; z <= WORLD_SIZE; z++) {
        let h = Math.floor(4 + pseudoNoise(x, z));
        h = Math.max(2, Math.min(9, h));
        for (let y = 0; y <= h; y++) {
          let t;
          if (y === h) t = 1; // grass top
          else if (y >= h - 2) t = 2; // dirt
          else t = 3; // stone
          voxels.set(key(x, y, z), t);
        }
      }
    }
    // scatter trees
    let treeCount = 0;
    for (let attempts = 0; attempts < 400 && treeCount < 22; attempts++) {
      const x = Math.floor(Math.random() * (WORLD_SIZE * 2 - 6)) - (WORLD_SIZE - 3);
      const z = Math.floor(Math.random() * (WORLD_SIZE * 2 - 6)) - (WORLD_SIZE - 3);
      const h = Math.floor(4 + pseudoNoise(x, z));
      const topKey = key(x, Math.max(2, Math.min(9, h)), z);
      if (voxels.get(topKey) !== 1) continue;
      const baseY = Math.max(2, Math.min(9, h)) + 1;
      const trunkHeight = 3 + Math.floor(Math.random() * 2);
      for (let ty = 0; ty < trunkHeight; ty++) voxels.set(key(x, baseY + ty, z), 4);
      const topY = baseY + trunkHeight;
      for (let lx = -2; lx <= 2; lx++) {
        for (let lz = -2; lz <= 2; lz++) {
          for (let ly = -1; ly <= 1; ly++) {
            if (Math.abs(lx) === 2 && Math.abs(lz) === 2) continue;
            const k = key(x + lx, topY + ly, z + lz);
            if (!voxels.has(k)) voxels.set(k, 5);
          }
        }
      }
      voxels.set(key(x, topY + 2, z), 5);
      treeCount++;
    }
  }
  generateWorld();

  // ---------- Instanced mesh rebuild ----------
  const meshes = {}; // type id -> InstancedMesh
  const meshPositions = {}; // type id -> array of [x,y,z] aligned with instance index
  const dummy = new THREE.Object3D();

  function rebuildMeshes() {
    // group by type
    const groups = {};
    BLOCK_TYPES.forEach(b => groups[b.id] = []);
    voxels.forEach((type, k) => {
      const [x, y, z] = k.split(',').map(Number);
      groups[type].push([x, y, z]);
    });

    BLOCK_TYPES.forEach(b => {
      const arr = groups[b.id];
      if (meshes[b.id]) {
        scene.remove(meshes[b.id]);
        meshes[b.id].dispose();
      }
      if (arr.length === 0) { meshes[b.id] = null; meshPositions[b.id] = []; return; }
      const mesh = new THREE.InstancedMesh(cubeGeo, materials[b.id], arr.length);
      for (let i = 0; i < arr.length; i++) {
        dummy.position.set(arr[i][0], arr[i][1], arr[i][2]);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.userData.blockType = b.id;
      scene.add(mesh);
      meshes[b.id] = mesh;
      meshPositions[b.id] = arr;
    });
  }
  rebuildMeshes();

  // ---------- Player ----------
  const player = {
    pos: new THREE.Vector3(0, 14, 0),
    velY: 0,
    yaw: 0,
    pitch: 0,
    onGround: false,
    flying: false,
    lastSpaceTime: 0,
  };
  camera.position.copy(player.pos);

  function groundHeightAt(x, z) {
    const gx = Math.round(x), gz = Math.round(z);
    let highest = -1;
    for (let y = 12; y >= 0; y--) {
      if (voxels.has(key(gx, y, gz))) { highest = y; break; }
    }
    return highest;
  }

  // ---------- Input ----------
  const keysDown = {};
  document.addEventListener('keydown', (e) => {
    keysDown[e.code] = true;
    if (e.code >= 'Digit1' && e.code <= 'Digit6') {
      selectSlot(parseInt(e.code.slice(-1), 10) - 1);
    }
    if (e.code === 'Space') {
      const now = performance.now();
      if (now - player.lastSpaceTime < 300) player.flying = !player.flying;
      player.lastSpaceTime = now;
    }
  });
  document.addEventListener('keyup', (e) => { keysDown[e.code] = false; });

  let pointerLocked = false;
  const overlay = document.getElementById('overlay');
  const canvasEl = renderer.domElement;

  overlay.addEventListener('click', () => {
    canvasEl.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === canvasEl;
    overlay.classList.toggle('hidden', pointerLocked);
  });

  document.addEventListener('mousemove', (e) => {
    if (!pointerLocked) return;
    const sensitivity = 0.0022;
    player.yaw -= e.movementX * sensitivity;
    player.pitch -= e.movementY * sensitivity;
    const limit = Math.PI / 2 - 0.05;
    player.pitch = Math.max(-limit, Math.min(limit, player.pitch));
  });

  // Prevent context menu on right click (used for placing blocks)
  canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());

  let selectedSlot = 0;
  function selectSlot(i) {
    selectedSlot = ((i % BLOCK_TYPES.length) + BLOCK_TYPES.length) % BLOCK_TYPES.length;
    document.querySelectorAll('.slot').forEach((el, idx) => {
      el.classList.toggle('active', idx === selectedSlot);
    });
  }

  const hotbarEl = document.getElementById('hotbar');
  BLOCK_TYPES.forEach((b, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (i === 0 ? ' active' : '');
    slot.innerHTML = `<div class="num">${i + 1}</div><div class="swatch" style="background:#${b.color.toString(16).padStart(6, '0')}"></div>`;
    slot.addEventListener('click', () => selectSlot(i));
    hotbarEl.appendChild(slot);
  });

  let statCount = 0;
  const statEl = document.getElementById('stat');
  const posEl = document.getElementById('pos');

  const raycaster = new THREE.Raycaster();
  raycaster.far = 7;

  function getInstancedMeshList() {
    return BLOCK_TYPES.map(b => meshes[b.id]).filter(m => m);
  }

  function handleClick(isBreak) {
    if (!pointerLocked) return;
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    const list = getInstancedMeshList();
    const intersects = raycaster.intersectObjects(list);
    if (intersects.length === 0) return;
    const hit = intersects[0];
    const type = hit.object.userData.blockType;
    const positions = meshPositions[type];
    const p = positions[hit.instanceId];
    if (!p) return;

    if (isBreak) {
      voxels.delete(key(p[0], p[1], p[2]));
      statCount++;
    } else {
      const normal = hit.face.normal.clone();
      const nx = p[0] + normal.x, ny = p[1] + normal.y, nz = p[2] + normal.z;
      // don't place inside the player
      const dx = Math.abs(nx - player.pos.x), dz = Math.abs(nz - player.pos.z);
      const dy = ny - (player.pos.y - 1.6);
      if (dx < 0.6 && dz < 0.6 && dy >= -0.2 && dy <= 1.4) return;
      const newType = BLOCK_TYPES[selectedSlot].id;
      voxels.set(key(nx, ny, nz), newType);
      statCount++;
    }
    statEl.textContent = statCount;
    rebuildMeshes();
  }

  canvasEl.addEventListener('mousedown', (e) => {
    if (!pointerLocked) return;
    if (e.button === 0) handleClick(true);
    else if (e.button === 2) handleClick(false);
  });

  // ---------- Game loop ----------
  const clock = new THREE.Clock();
  const EYE_HEIGHT = 1.7;

  function updatePlayer(dt) {
    const speed = (keysDown['ShiftLeft'] && player.flying) ? 6 : 5.2;
    const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).negate();
    const right = new THREE.Vector3(forward.z, 0, -forward.x);

    let moveX = 0, moveZ = 0;
    if (keysDown['KeyW']) { moveX += forward.x; moveZ += forward.z; }
    if (keysDown['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
    if (keysDown['KeyA']) { moveX -= right.x; moveZ -= right.z; }
    if (keysDown['KeyD']) { moveX += right.x; moveZ += right.z; }
    const len = Math.hypot(moveX, moveZ);
    if (len > 0) { moveX = moveX / len * speed * dt; moveZ = moveZ / len * speed * dt; }

    player.pos.x += moveX;
    player.pos.z += moveZ;

    const ground = groundHeightAt(player.pos.x, player.pos.z);
    const groundSurfaceY = ground + 1 + EYE_HEIGHT - 1; // top of block + eye height offset base

    if (player.flying) {
      player.velY = 0;
      if (keysDown['Space']) player.pos.y += speed * dt;
      if (keysDown['ShiftLeft']) player.pos.y -= speed * dt;
      const minY = ground + EYE_HEIGHT;
      if (player.pos.y < minY) player.pos.y = minY;
    } else {
      player.velY -= 20 * dt; // gravity
      player.pos.y += player.velY * dt;
      const minY = ground + EYE_HEIGHT;
      if (player.pos.y <= minY) {
        player.pos.y = minY;
        player.velY = 0;
        player.onGround = true;
        if (keysDown['Space']) player.velY = 7.2;
      } else {
        player.onGround = false;
      }
    }

    camera.position.copy(player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    posEl.textContent = `${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}`;
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (pointerLocked) updatePlayer(dt);
    renderer.render(scene, camera);
  }
  animate();

  // Esc handled natively by pointer lock (browser releases lock); overlay shows automatically via pointerlockchange.
})();
</script>
</body>
</html>
